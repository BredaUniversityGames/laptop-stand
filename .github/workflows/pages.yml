# Publishes the BUAS Laptop Stand Maker to GitHub Pages.
# The site is static (index.html + styles.css + buas.png, libraries from CDNs), so "building" is just
# collecting the site files into _site/ — nothing else in the repo (photos, .claude/, …) is published.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; don't cancel one that's already running.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Collect site files
        run: |
          mkdir -p _site
          cp index.html styles.css buas.png license.txt _site/
          # Fail early if the page links a local file we didn't copy.
          for f in $(grep -oE '(href|src)="[^":]+"' index.html | sed -E 's/.*="([^"]+)"/\1/' | grep -v '^#'); do
            if [ ! -f "_site/$f" ]; then echo "::error::index.html references $f, which is not in _site/"; exit 1; fi
          done
          ls -la _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
